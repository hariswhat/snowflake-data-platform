[project]
name = "snowflake-data-platform"
version = "0.1.0"
description = "Snowpipe, streams and tasks, SCD2 and governance for a fictional retailer, tested on DuckDB"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
